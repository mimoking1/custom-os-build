set default=0
set timeout=4

insmod all_video
insmod gfxterm
insmod png

loadfont /boot/grub/fonts/comfortaa-bold-22.pf2
loadfont /boot/grub/fonts/comfortaa-regular-13.pf2

set gfxmode=1024x768,800x600,640x480,auto
set gfxpayload=keep
terminal_output gfxterm

set theme=/boot/grub/live-theme/theme.txt
export theme
