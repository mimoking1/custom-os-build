---
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules ]
instances:
- id:       main
  module:   main
  config:   main
sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - packages
  - initramfs
  - hwclock
  - bootloader
  - umount
- show:
  - finished
branding: customos
prompt-install: true
dont-chroot: false
