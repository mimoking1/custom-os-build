name: Build and boot-test ISOs
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Which version to build'
        required: true
        default: 'both'
        type: choice
        options: [full, live, both, full32, live32, both32, all]
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  prep:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          V="${{ github.event.inputs.variant }}"
          case "$V" in
            full) M='["full"]';; live) M='["live"]';; both|"") M='["full","live"]';;
            full32) M='["full32"]';; live32) M='["live32"]';; both32) M='["full32","live32"]';;
            all) M='["full","live","full32","live32"]';;
          esac
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
  build:
    needs: prep
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.prep.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: Install KVM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-system-x86 qemu-utils socat netcat-openbsd python3-pil python3-numpy imagemagick
          sudo modprobe kvm-intel || sudo modprobe kvm-amd || true
          sudo chmod 666 /dev/kvm || true
          ls -la /dev/kvm

      - name: Build MSI self-test package
        run: |
          sudo apt-get install -y -qq msitools wixl || sudo apt-get install -y -qq wixl
          mkdir -p build/includes.chroot/usr/share/customos/tests
          wixl -v -a x64 build/test-msi/test.wxs -o build/includes.chroot/usr/share/customos/tests/customos-test.msi
          msiinfo extract build/includes.chroot/usr/share/customos/tests/customos-test.msi SummaryInformation | head -5; msiinfo tables build/includes.chroot/usr/share/customos/tests/customos-test.msi | tr "\n" " "; msiinfo export build/includes.chroot/usr/share/customos/tests/customos-test.msi File 2>/dev/null | grep -i test.txt | head -3 || true
          ls -la build/includes.chroot/usr/share/customos/tests/

      - name: Build ISO (${{ matrix.variant }})
        run: sudo ./build/build-iso.sh variants/${{ matrix.variant }}.conf

      - name: Boot test in QEMU
        run: |
          if [[ "${{ matrix.variant }}" == *32 ]]; then export QEMU_BIN=qemu-system-i386 QEMU_CPU=qemu32,+pae; fi
          ./build/boot-test/boot-test.sh "$(ls out/*.iso | head -1)" out/boot-test

      - name: Publish evidence to rolling release (bypasses artifact quota)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ci-evidence >/dev/null 2>&1 ||             gh release create ci-evidence --title "CI evidence (rolling)" --notes "Automated evidence upload. Assets prefixed by run id; only the latest run is kept." --latest=false
          # keep only this run's assets
          gh release view ci-evidence --json assets --jq '.assets[].name' | while read a; do
            case "$a" in ${GITHUB_RUN_ID}-*) ;; *) gh release delete-asset ci-evidence "$a" -y || true;; esac
          done
          for f in out/boot-test/*.png out/boot-test/serial.log out/boot-test/selftest-results.txt out/SHA256SUMS.txt; do
            [ -f "$f" ] || continue
            gh release upload ci-evidence "$f#${GITHUB_RUN_ID}-$(basename "$f")" --clobber || true
          done

      - name: Upload ISO + evidence
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-iso
          path: |
            out/*.iso
            out/SHA256SUMS.txt
          retention-days: 1
      - name: Upload evidence (small)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-evidence
          path: |
            out/boot-test/*.png
            out/boot-test/serial.log
            out/boot-test/selftest-results.txt
          retention-days: 1

      - name: Publish public release (assets < 2GiB)
        run: |
          ISO=$(ls out/*.iso | head -1)
          SIZE=$(stat -c%s "$ISO")
          if [ "$SIZE" -lt 2147483648 ]; then
            gh release view latest-build >/dev/null 2>&1 || \
              gh release create latest-build --title "Latest build" --notes "Automated build - newest ISOs"
            gh release upload latest-build "$ISO" out/SHA256SUMS.txt --clobber
          else
            echo "ISO is $(( SIZE / 1048576 )) MiB > 2048 MiB GitHub cap - grab it from Artifacts instead" | tee out/HOSTING-NOTE.txt
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
