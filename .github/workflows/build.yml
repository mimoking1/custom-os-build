name: Build and boot-test ISOs
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Which version to build'
        required: true
        default: 'both'
        type: choice
        options: [full, live, both, full32, live32, both32, all]
      deliver:
        description: 'Upload ISOs to Gofile and publish download links'
        required: false
        default: 'no'
        type: choice
        options: ['no', 'yes']
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  prep:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          V="${{ github.event.inputs.variant }}"
          case "$V" in
            full) M='["full"]';; live) M='["live"]';; both|"") M='["full","live"]';;
            full32) M='["full32"]';; live32) M='["live32"]';; both32) M='["full32","live32"]';;
            all) M='["full","live","full32","live32"]';;
          esac
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
  build:
    needs: prep
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.prep.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: Install KVM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-system-x86 qemu-utils socat netcat-openbsd python3-pil python3-numpy imagemagick
          sudo modprobe kvm-intel || sudo modprobe kvm-amd || true
          sudo chmod 666 /dev/kvm || true
          ls -la /dev/kvm

      - name: Build MSI self-test package
        run: |
          sudo apt-get install -y -qq msitools wixl || sudo apt-get install -y -qq wixl
          mkdir -p build/includes.chroot/usr/share/customos/tests
          wixl -v -a x64 build/test-msi/test.wxs -o build/includes.chroot/usr/share/customos/tests/customos-test.msi
          msiinfo extract build/includes.chroot/usr/share/customos/tests/customos-test.msi SummaryInformation | head -5; msiinfo tables build/includes.chroot/usr/share/customos/tests/customos-test.msi | tr "\n" " "; msiinfo export build/includes.chroot/usr/share/customos/tests/customos-test.msi File 2>/dev/null | grep -i test.txt | head -3 || true
          ls -la build/includes.chroot/usr/share/customos/tests/

      - name: Fetch private payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/fetch-private.sh
      - name: Build ISO (${{ matrix.variant }})
        run: sudo ./build/build-iso.sh variants/${{ matrix.variant }}.conf

      - name: Boot test in QEMU
        run: |
          if [[ "${{ matrix.variant }}" == *32 ]]; then export QEMU_BIN=qemu-system-i386 QEMU_CPU=qemu32,+pae; fi
          ./build/boot-test/boot-test.sh "$(ls out/*.iso | head -1)" out/boot-test

      - name: Verify selftest completed
        run: |
          if ! grep -q "SELFTEST-DONE" out/boot-test/selftest-results.txt 2>/dev/null; then
            echo "::error::Selftest did not reach SELFTEST-DONE - evidence truncated, build counts as UNTESTED."
            exit 1
          fi

      - name: Publish evidence to rolling release (bypasses artifact quota)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ci-evidence >/dev/null 2>&1 ||             gh release create ci-evidence --title "CI evidence (rolling)" --notes "Automated evidence upload. Assets prefixed by run id; only the latest run is kept." --latest=false
          # keep only this run's assets
          gh release view ci-evidence --json assets --jq '.assets[].name' | while read a; do
            case "$a" in ${GITHUB_RUN_ID}-*) ;; *) gh release delete-asset ci-evidence "$a" -y </dev/null || true;; esac
          done
          mkdir -p /tmp/evidence
          for f in out/boot-test/*.png out/boot-test/serial.log out/boot-test/selftest-results.txt out/SHA256SUMS.txt; do
            [ -f "$f" ] || continue
            n="${GITHUB_RUN_ID}-${{ matrix.variant }}-$(basename "$f")"
            cp "$f" "/tmp/evidence/$n"
            gh release upload ci-evidence "/tmp/evidence/$n" --clobber </dev/null || true
          done

      - name: Upload ISO + evidence
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-iso
          path: |
            out/*.iso
            out/SHA256SUMS.txt
          retention-days: 1
      - name: Upload evidence (small)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-evidence
          path: |
            out/boot-test/*.png
            out/boot-test/serial.log
            out/boot-test/selftest-results.txt
          retention-days: 1

      - name: Deliver ISO via Gofile (no-account download link)
        if: ${{ inputs.deliver == 'yes' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p /tmp/evidence
          ISO=$(ls out/*.iso | head -1)
          BASE=$(basename "$ISO")
          SHA=$(sha256sum "$ISO" | awk '{print $1}')
          SIZE=$(stat -c%s "$ISO")
          echo "==> Uploading $BASE ($(( SIZE / 1048576 )) MiB) to Gofile"
          RESP=""
          for attempt in 1 2 3; do
            RESP=$(curl -fsS --retry 3 --retry-delay 10 -F "file=@$ISO" https://upload.gofile.io/uploadfile) && break
            echo "upload attempt $attempt failed, retrying"; sleep 20
          done
          echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('status')=='ok', d; open('out/gofile-link.txt','w').write(d['data']['downloadPage']); open('out/gofile-admin.txt','w').write(json.dumps({k:d['data'].get(k) for k in ('guestToken','id','parentFolder')}))" || { echo "::error::Gofile upload failed: $RESP"; exit 1; }
          LINK=$(cat out/gofile-link.txt)
          {
            echo "variant: ${{ matrix.variant }}"
            echo "file: $BASE"
            echo "size_bytes: $SIZE"
            echo "sha256: $SHA"
            echo "download: $LINK"
          } | tee "out/delivery-${{ matrix.variant }}.txt"
          gh release view ci-evidence >/dev/null 2>&1 || gh release create ci-evidence --title "CI evidence (rolling)" --latest=false || true
          cp "out/delivery-${{ matrix.variant }}.txt" "/tmp/evidence/${GITHUB_RUN_ID}-delivery-${{ matrix.variant }}.txt"
          cp "out/gofile-admin.txt" "/tmp/evidence/${GITHUB_RUN_ID}-gofile-admin-${{ matrix.variant }}.txt"
          gh release upload ci-evidence "/tmp/evidence/${GITHUB_RUN_ID}-delivery-${{ matrix.variant }}.txt" --clobber </dev/null || true

