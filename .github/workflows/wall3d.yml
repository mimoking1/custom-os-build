name: wall3d
on:
  workflow_dispatch:
    inputs:
      names:
        description: 'space separated scene names'
        required: true
        default: 'rose violet emerald gold slate coral'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Install blender
        run: sudo apt-get update -qq && sudo apt-get install -y -qq blender imagemagick
      - name: Render
        run: |
          mkdir -p out
          for n in ${{ inputs.names }}; do
            timeout 900 blender -b -P wall3d/scene.py -- $n out/$n.png > out/$n.log 2>&1 || { echo "FAILED $n"; tail -15 out/$n.log; }
            [ -f out/$n.png ] && convert out/$n.png -quality 90 out/wall3d-$n.jpg && ls -la out/wall3d-$n.jpg
          done
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ci-evidence >/dev/null 2>&1 || gh release create ci-evidence --title "CI evidence (rolling)" --notes "x" --latest=false
          for f in out/wall3d-*.jpg; do [ -e "$f" ] && gh release upload ci-evidence "$f" --clobber </dev/null || true; done
          for f in out/*.log; do cp "$f" "/tmp/wall3d-$(basename $f)"; gh release upload ci-evidence "/tmp/wall3d-$(basename $f)" --clobber </dev/null || true; done
