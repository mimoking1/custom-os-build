name: deliver-artifact
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: 'build run id'
        required: true
      variant:
        description: 'full or live'
        required: true
permissions:
  contents: write
  actions: read
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Get ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.variant }}-iso
          run-id: ${{ inputs.build_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: iso
      - name: Upload to Gofile and record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISO=$(ls iso/*.iso | head -1); BASE=$(basename "$ISO")
          SIZE=$(stat -c %s "$ISO"); SHA=$(sha256sum "$ISO" | awk '{print $1}')
          echo "$BASE $SIZE $SHA"; cat iso/SHA256SUMS.txt || true
          for i in 1 2 3; do
            RESP=$(curl -fsS --retry 3 --retry-delay 10 -F "file=@$ISO" https://upload.gofile.io/uploadfile) && break
          done
          LINK=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d.get('status')=='ok', d; print(d['data']['downloadPage'])")
          { echo "variant: ${{ inputs.variant }}"; echo "source_build_run: ${{ inputs.build_run }}"; echo "file: $BASE"; echo "size_bytes: $SIZE"; echo "sha256: $SHA"; echo "download: $LINK"; } | tee /tmp/delivery.txt
          gh release view ci-evidence >/dev/null 2>&1 || gh release create ci-evidence --title "CI evidence (rolling)" --notes "x" --latest=false
          cp /tmp/delivery.txt "/tmp/${GITHUB_RUN_ID}-delivery-artifact-${{ inputs.variant }}.txt"
          gh release upload ci-evidence "/tmp/${GITHUB_RUN_ID}-delivery-artifact-${{ inputs.variant }}.txt" --clobber </dev/null
