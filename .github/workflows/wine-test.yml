name: wine-test
on:
  workflow_dispatch:
    inputs:
      note:
        description: 'label'
        required: false
        default: v5
permissions:
  contents: write
jobs:
  wt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install wine and tools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq wine wine64 xvfb xdotool imagemagick x11-utils xz-utils fonts-noto-core fonts-noto-ui-core || sudo apt-get install -y -qq wine xvfb xdotool imagemagick x11-utils xz-utils
          wine --version || true
      - name: Fetch private payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/pl
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          curl -fsS -H "Authorization: Bearer ${GH_TOKEN}" "$API/releases?per_page=100" > /tmp/rels.json
          python3 - <<'PY' > /tmp/wt-assets.txt
          import json
          for r in json.load(open('/tmp/rels.json')):
              if r.get('tag_name') in ('tahmeel-wine-test','tahmeel-private'):
                  for a in r['assets']: print(a['id'], a['name'])
          PY
          while read -r id name; do
            case "$name" in *.exe|*.tar.xz) curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/octet-stream" "$API/releases/assets/$id" -o "/tmp/pl/$name";; esac
          done < /tmp/wt-assets.txt
          ls -la /tmp/pl
      - name: Run test
        run: bash tools/wine-test.sh
        continue-on-error: true
      - name: Publish evidence
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in /tmp/wt-out/*; do
            [ -e "$f" ] || continue
            n="winetest-${GITHUB_RUN_ID}-$(basename "$f")"
            cp "$f" "/tmp/$n"
            gh release upload ci-evidence "/tmp/$n" --clobber </dev/null || true
          done
