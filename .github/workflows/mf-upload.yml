name: mf-upload
on:
  workflow_dispatch:
    inputs:
      build_run: {description: build run id, required: true}
      variant: {description: full or live, required: true}
permissions:
  contents: read
  actions: read
jobs:
  up:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.variant }}-iso
          run-id: ${{ inputs.build_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: iso
      - run: pip install mediafire
      - name: Upload
        env:
          MF_PW: ${{ secrets.MF_PW }}
        run: |
          ISO=$(ls iso/*.iso | head -1); sha256sum "$ISO"; ls -l "$ISO"
          python3 build/mf_upload.py "$ISO" 2>&1 | sed "s/${MF_PW}/***/g"
